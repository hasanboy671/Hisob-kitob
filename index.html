<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ombor MD (Mobil)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #11161d;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* AVTORIZATSIYA */
        .auth-container {
            background-color: #1f252e;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
            margin: 50px auto;
            border: 1px solid #2d3543;
        }
        .auth-container h2 {
            text-align: center;
            color: #00f2fe;
            margin-bottom: 25px;
            font-size: 26px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0aec0;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #15191e;
            border: 1px solid #3b4454;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        .input-group input:focus {
            border-color: #00f2fe;
            outline: none;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #11161d;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #a0aec0;
            cursor: pointer;
        }
        .toggle-link span {
            color: #00f2fe;
            text-decoration: underline;
        }

        /* DASHBOARD INTERFEYSI */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 1200px;
        }
        .main-title-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .main-title-box h1 {
            color: #00f2fe;
            font-size: 28px;
        }
        .main-title-box p {
            color: #a0aec0;
            font-size: 14px;
        }

        /* Statistika */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background-color: #1f252e;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #2d3543;
        }
        .stat-card p {
            font-size: 11px;
            color: #a0aec0;
            margin-bottom: 5px;
        }
        .stat-card h3 {
            font-size: 28px;
            font-weight: bold;
        }
        .stat-jami { color: #00f2fe; }
        .stat-kam { color: #f6ad55; }
        .stat-tugadi { color: #fc8181; }

        /* Kiritish Formasi */
        .form-section {
            background-color: #1f252e;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            border: 1px solid #2d3543;
        }
        .form-section h3 {
            color: #00f2fe;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-grid input {
            padding: 12px;
            background-color: #15191e;
            border: 1px solid #3b4454;
            border-radius: 6px;
            color: white;
            font-size: 15px;
        }
        .form-grid input:focus {
            border-color: #00f2fe;
            outline: none;
        }
        .submit-btn {
            padding: 14px;
            background-color: #00f2fe;
            color: #11161d;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Mahsulot kartalari */
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-card {
            background-color: #1f252e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2d3543;
            border-left: 6px solid #48bb78;
            position: relative;
        }
        .product-card.kam { border-left-color: #f6ad55; }
        .product-card.tugadi { border-left-color: #fc8181; }

        .prod-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .prod-info {
            font-size: 14px;
            color: #cbd5e0;
            margin-bottom: 5px;
        }
        .prod-info b { color: #ffffff; }
        
        .tavsiya {
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
        .tavsiya.yaxshi { color: #f6ad55; }
        .tavsiya.yomon { color: #fc8181; }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .status-badge.yetarli { background-color: rgba(72,187,120,0.2); color: #48bb78; }
        .status-badge.kam { background-color: rgba(246,173,85,0.2); color: #f6ad55; }
        .status-badge.tugadi { background-color: rgba(252,129,129,0.2); color: #fc8181; }

        /* Boshqaruv tugmalari */
        .actions-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-act {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-p { background-color: #48bb78; }
        .btn-m { background-color: #f6ad55; }
        .btn-d { background-color: #e53e3e; flex: 0 0 50px; }

        .user-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-box">
        <h2 id="auth-title">Tizimga Kirish</h2>
        <div class="input-group">
            <label>Ismingiz:</label>
            <input type="text" id="auth-name" placeholder="Hasanboy">
        </div>
        <div class="input-group">
            <label>Telefon raqam:</label>
            <input type="tel" id="auth-phone" placeholder="+998901234567">
        </div>
        <button class="auth-btn" id="auth-main-btn" onclick="handleAuth()">Kirish</button>
        <div class="toggle-link" id="auth-toggle" onclick="toggleAuthMode()">Hisobingiz yo'qmi? <span>Ro'yxatdan o'tish</span></div>
    </div>

    <div class="dashboard" id="dashboard-box">
        <div class="main-title-box">
            <h1>Ombor MD (Mobil)</h1>
            <p>Zaxira va hisob-kitob nazorati</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><p>JAMI</p><h3 class="stat-jami" id="count-jami">0</h3></div>
            <div class="stat-card"><p>KAM</p><h3 class="stat-kam" id="count-kam">0</h3></div>
            <div class="stat-card"><p>TUGADI</p><h3 class="stat-tugadi" id="count-tugadi">0</h3></div>
        </div>

        <div class="form-section">
            <h3>Yangi Mahsulot Kiritish</h3>
            <div class="form-grid">
                <input type="text" id="p-name" placeholder="Mahsulot nomi">
                <input type="number" id="p-qty" placeholder="Soni">
                <input type="number" id="p-limit" placeholder="Min. chegara">
                <button class="submit-btn" onclick="addSubmit()">Omborga Yuklash</button>
            </div>
        </div>

        <div class="products-list" id="products-container"></div>
        
        <div class="user-footer">
            Xodim: <b id="user-display" style="color:#00f2fe"></b> | <span style="cursor:pointer; text-decoration:underline" onclick="logout()">Chiqish</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnZ6FS20hlv_tR2lj7KyXrZWzrZcMfxY",
            authDomain: "ombor-nazorati.firebaseapp.com",
            projectId: "ombor-nazorati",
            storageBucket: "ombor-nazorati.firebasestorage.app",
            messagingSenderId: "307355318900",
            appId: "1:307355318900:web:dd5373531f9ab733ee6f21",
            measurementId: "G-E238PBY29V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isLoginMode = true;
        let currentUser = JSON.parse(localStorage.getItem('current_user')) || null;

        window.onload = function() {
            if (currentUser) { showDashboard(); } else { showAuth(); }
        };

        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Tizimga Kirish" : "Ro'yxatdan O'tish";
            document.getElementById('auth-main-btn').innerText = isLoginMode ? "Kirish" : "Ro'yxatdan o'tish";
            document.getElementById('auth-toggle').innerHTML = isLoginMode ? "Hisobingiz yo'qmi? <span>Ro'yxatdan o'tish</span>" : "Profil bormi? <span>Tizimga kirish</span>";
        };

        window.handleAuth = async function() {
            const name = document.getElementById('auth-name').value.trim();
            const phone = document.getElementById('auth-phone').value.trim();
            if (!name || !phone) return alert("To'ldiring!");

            const usersRef = collection(db, "users");
            const querySnapshot = await getDocs(usersRef);
            let foundUser = null;

            querySnapshot.forEach((doc) => {
                let u = doc.data();
                if (u.phone === phone) foundUser = u;
            });

            if (isLoginMode) {
                if (foundUser && foundUser.name.toLowerCase() === name.toLowerCase()) {
                    currentUser = foundUser;
                    localStorage.setItem('current_user', JSON.stringify(currentUser));
                    showDashboard();
                } else { alert("Xato ma'lumot!"); }
            } else {
                if (foundUser) return alert("Raqam band!");
                await addDoc(usersRef, { name, phone });
                currentUser = { name, phone };
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                showDashboard();
            }
        };

        window.logout = function() {
            localStorage.removeItem('current_user');
            currentUser = null;
            showAuth();
        };

        function showAuth() { 
            document.getElementById('auth-box').style.display = 'block'; 
            document.getElementById('dashboard-box').style.display = 'none'; 
        }
        
        function showDashboard() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard-box').style.display = 'block';
            document.getElementById('user-display').innerText = currentUser.name;
            listenToInventory();
        }

        window.addSubmit = async function() {
            const name = document.getElementById('p-name').value.trim();
            const qty = parseInt(document.getElementById('p-qty').value);
            const limit = parseInt(document.getElementById('p-limit').value);
            if (!name || isNaN(qty) || isNaN(limit)) return alert("To'g'ri to'ldiring!");

            await addDoc(collection(db, "inventory"), { name, qty, limit });
            document.getElementById('p-name').value = ''; 
            document.getElementById('p-qty').value = ''; 
            document.getElementById('p-limit').value = '';
        };

        function listenToInventory() {
            onSnapshot(collection(db, "inventory"), (snapshot) => {
                const container = document.getElementById('products-container');
                container.innerHTML = '';
                let jami = 0, kam = 0, tugadi = 0;

                snapshot.forEach((docSnap) => {
                    jami++;
                    const item = docSnap.data();
                    const id = docSnap.id;
                    
                    let badgeText = 'Yetarli', badgeClass = 'yetarli', cardClass = '', tavsiyaText = 'Zaxira joyida', tavsiyaClass = 'yaxshi';

                    if (item.qty === 0) { 
                        badgeText = 'Tugadi'; badgeClass = 'tugadi'; cardClass = 'tugadi'; 
                        tavsiyaText = `Olib kelish kerak: ${item.limit + 5} ta`; tavsiyaClass = 'yomon';
                        tugadi++; 
                    } else if (item.qty <= item.limit) { 
                        badgeText = 'Kam qoldi'; badgeClass = 'kam'; cardClass = 'kam'; 
                        tavsiyaText = `Olib kelish kerak: ${item.limit - item.qty} ta`; tavsiyaClass = 'yomon';
                        kam++; 
                    }

                    container.innerHTML += `
                        <div class="product-card ${cardClass}">
                            <div class="prod-title">${item.name}</div>
                            <div class="prod-info">Omborda bor: <b>${item.qty} ta</b></div>
                            <div class="prod-info">Minimal chegara: ${item.limit} ta</div>
                            <div class="tavsiya ${tavsiyaClass}">Tavsiya: ${tavsiyaText}</div>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                            <div class="actions-row">
                                <button class="btn-act btn-p" onclick="updateQty('${id}', ${item.qty}, 1)">+1</button>
                                <button class="btn-act btn-m" onclick="updateQty('${id}', ${item.qty}, -1)">-1</button>
                                <button class="btn-act btn-d" onclick="deleteItem('${id}')">🗑️</button>
                            </div>
                        </div>`;
                });
                document.getElementById('count-jami').innerText = jami;
                document.getElementById('count-kam').innerText = kam;
                document.getElementById('count-tugadi').innerText = tugadi;
            });
        }

        window.updateQty = async function(id, currentQty, amount) {
            let newQty = currentQty + amount;
            if (newQty < 0) newQty = 0;
            await updateDoc(doc(db, "inventory", id), { qty: newQty });
        };

        window.deleteItem = async function(id) {
            if (confirm("O'chirilsinmi?")) await deleteDoc(doc(db, "inventory", id));
        };
    </script>
</body>
</html>
